server:
  port: 7070
spring:
  application:
    name: web-java-course
  datasource:
    url:
    username:
    password:
  liquibase:
    change-log: classpath:liquibase/changelog.yaml
    enabled: true
  jpa:
    hibernate.ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: RS256 # default actually
          jwk-set-uri: http://localhost:8083/.well-known/jwks.json
application:
  rest-client:
    response-timeout: 1000
  web-service-product-repository:
    url: http://localhost:7071/v1/api/products
feature:
  cosmoCats:
    enabled: true
  kittyProducts:
    enabled: false
